<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>🌤️ Weather Forecast</h1>
    <p>Check current weather and forecast for any city</p>
</header>

<main>

    <section class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button onclick="searchWeather()">Search</button>
        <button onclick="getLocationWeather()">📍 My Location</button>
    </section>

    <p id="message"></p>

    <section id="weather" class="weather-card hidden">

        <div class="current-weather">
            <div>
                <h2 id="cityName">--</h2>
                <p id="date">--</p>
                <p id="description">--</p>
            </div>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>
        </div>

        <div class="details">

            <div class="detail">
                <span>💧</span>
                <p>Humidity</p>
                <strong id="humidity">--</strong>
            </div>

            <div class="detail">
                <span>💨</span>
                <p>Wind Speed</p>
                <strong id="wind">--</strong>
            </div>

            <div class="detail">
                <span>🌡️</span>
                <p>Feels Like</p>
                <strong id="feels">--</strong>
            </div>

            <div class="detail">
                <span>☁️</span>
                <p>Cloud Cover</p>
                <strong id="cloud">--</strong>
            </div>

        </div>

        <h2 class="forecast-title">5-Day Forecast</h2>

        <div id="forecast" class="forecast"></div>

    </section>

</main>

<footer>
    <p>Weather Forecasting Application</p>
    <p>Built with HTML, CSS, JavaScript & Python</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
